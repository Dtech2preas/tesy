name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Setup Android Build Tools
      run: |
        export BUILD_TOOLS_VERSION="34.0.0"
        echo "BUILD_TOOLS_VERSION=${BUILD_TOOLS_VERSION}" >> $GITHUB_ENV
        # Create a symlink from default location that sign-android-release searches for to the one we actually have
        sudo mkdir -p /usr/local/lib/android/sdk/build-tools/29.0.3/
        sudo ln -sf /usr/local/lib/android/sdk/build-tools/34.0.0/zipalign /usr/local/lib/android/sdk/build-tools/29.0.3/zipalign
        sudo ln -sf /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner /usr/local/lib/android/sdk/build-tools/29.0.3/apksigner

    - name: Clean Secrets
      id: clean_secrets
      env:
        STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
      run: |
        CLEAN_STORE_PASS=$(printf '%s' "$STORE_PASS" | tr -d '\n\r')
        CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '\n\r')
        CLEAN_ALIAS=$(printf '%s' "$ALIAS" | tr -d '\n\r')

        if [ -z "$CLEAN_KEY_PASS" ]; then
          CLEAN_KEY_PASS="$CLEAN_STORE_PASS"
        fi

        printf '::add-mask::%s\n' "$CLEAN_STORE_PASS"
        printf '::add-mask::%s\n' "$CLEAN_KEY_PASS"
        printf '::add-mask::%s\n' "$CLEAN_ALIAS"

        EOF_MARKER=$(openssl rand -hex 16)
        printf 'store_pass<<%s\n%s\n%s\n' "$EOF_MARKER" "$CLEAN_STORE_PASS" "$EOF_MARKER" >> "$GITHUB_OUTPUT"
        printf 'key_pass<<%s\n%s\n%s\n' "$EOF_MARKER" "$CLEAN_KEY_PASS" "$EOF_MARKER" >> "$GITHUB_OUTPUT"
        printf 'alias<<%s\n%s\n%s\n' "$EOF_MARKER" "$CLEAN_ALIAS" "$EOF_MARKER" >> "$GITHUB_OUTPUT"

    - name: Sign App APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ steps.clean_secrets.outputs.alias }}
        keyStorePassword: ${{ steps.clean_secrets.outputs.store_pass }}
        keyPassword: ${{ steps.clean_secrets.outputs.key_pass }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-uni-release-apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
