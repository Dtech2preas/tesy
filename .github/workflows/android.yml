name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK manually
      id: sign_app
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
      run: |
        # Decode Keystore
        echo "$SIGNING_KEY" | base64 --decode > release.jks

        # Determine exact paths
        APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
        ALIGNED_APK_PATH="app/build/outputs/apk/release/app-release-unsigned-aligned.apk"
        SIGNED_APK_PATH="app/build/outputs/apk/release/app-release.apk"

        # Passwords file setup to avoid shell parsing completely
        printf '%s' "$STORE_PASS" > store_pass.txt
        if [ -z "$KEY_PASS" ]; then
          printf '%s' "$STORE_PASS" > key_pass.txt
        else
          printf '%s' "$KEY_PASS" > key_pass.txt
        fi

        # Zipalign
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$APK_PATH" "$ALIGNED_APK_PATH"

        # Apksigner using file passes
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.jks \
            --ks-pass file:store_pass.txt \
            --ks-key-alias "$ALIAS" \
            --key-pass file:key_pass.txt \
            --out "$SIGNED_APK_PATH" \
            "$ALIGNED_APK_PATH"

        # Clean up sensitive files
        rm store_pass.txt key_pass.txt

        echo "signedReleaseFile=$SIGNED_APK_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-uni-release-apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
