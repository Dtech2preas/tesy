name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
      run: echo "$ENCODED_STRING" | base64 --decode > keystore.jks

    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        CLEAN_STORE_PASS=$(echo "$KEYSTORE_PASSWORD" | tr -d '\n\r')
        CLEAN_ALIAS=$(echo "$ALIAS" | tr -d '\n\r')
        CLEAN_KEY_PASS=$(echo "$KEY_PASSWORD" | tr -d '\n\r')
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
          -Pandroid.injected.signing.store.password="${CLEAN_STORE_PASS}" \
          -Pandroid.injected.signing.key.alias="${CLEAN_ALIAS}" \
          -Pandroid.injected.signing.key.password="${CLEAN_KEY_PASS}"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-uni-release-apk
        path: app/build/outputs/apk/release/app-release.apk
