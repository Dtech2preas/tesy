name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign APK manually
      id: sign_app
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        ALIAS: ${{ secrets.ALIAS }}
      run: |
        # Decode Keystore
        echo "$SIGNING_KEY" | base64 --decode > release.jks

        # Determine exact paths
        APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
        ALIGNED_APK_PATH="app/build/outputs/apk/release/app-release-unsigned-aligned.apk"
        SIGNED_APK_PATH="app/build/outputs/apk/release/app-release.apk"

        # Clean up passwords (strip newlines just in case)
        export CLEAN_STORE_PASS=$(printf '%s' "$STORE_PASS" | tr -d '\n\r')
        export CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '\n\r')
        export CLEAN_ALIAS=$(printf '%s' "$ALIAS" | tr -d '\n\r')

        if [ -z "$CLEAN_KEY_PASS" ]; then
          export CLEAN_KEY_PASS="$CLEAN_STORE_PASS"
        fi

        # Zipalign
        $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$APK_PATH" "$ALIGNED_APK_PATH"

        # Apksigner
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.jks \
            --ks-pass env:CLEAN_STORE_PASS \
            --ks-key-alias "$CLEAN_ALIAS" \
            --key-pass env:CLEAN_KEY_PASS \
            --out "$SIGNED_APK_PATH" \
            "$ALIGNED_APK_PATH"

        echo "signedReleaseFile=$SIGNED_APK_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-uni-release-apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
